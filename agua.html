            <h1 class="article-title">我的第一个周报</h1>
        <div class="article-body">
            <p>第一周是建立自己的blog，真的十分坎坷。</p>
            <p>开始是注册账户，开始的时候没有对github有了解，不知道是外网的，登进去全凭运气，进去之后两眼茫然，全是英语。。。。。但由于时间不够就没有去真正的了解这个网站。</p>
			<p>第二天的时候，才有时间认真去看整个网站的作用，花了一个早上才做出来一个网页，但是无法称为blog，又看了一眼群消息，大家的成品都令我羡慕，我的网页倒是显得廉价。下午我尝试使用AI软件按照指令给我编写网页，并尝试在AI的代码下理解一些代码的含义，并且发现了AI给我编写的代码无法满足我的需求，于是我再次尝试AI编写了一段页面转跳的代码，AI给了我很多代码，但是无一能够成功，我就一点点地尝试，终于成功，虽然只有一个页面可以转跳但是我发现了让我网页无法转跳的那个代码。</p>
		 	<p>但是目前我的blog仍然存在很多问题，就是我的每一篇blog的编写都要单独写一个html，并且现在两个页面的背景还是十分割裂，其次我在网页代码上也存在很多未知。</p>
